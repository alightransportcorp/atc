<script>
(function(){try{
  var k=new URLSearchParams(location.search).get('k')||localStorage.getItem('atc_key');
  if(!k||!/iPhone|iPad|iPod/.test(navigator.userAgent))return;
  if(!new URLSearchParams(location.search).get('k')) history.replaceState(null,'',location.pathname+'?k='+encodeURIComponent(k));
  var l=document.querySelector('link[rel=manifest]'); if(l) l.parentNode.removeChild(l);
}catch(e){}})();
</script>
<script>try{var _t=localStorage.getItem('atc_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>

<script>
(function () {
  // iPhone home-screen apps report a height that is short by the status bar; use the real screen height there.
  function fit() {
    var h = window.innerHeight;
    if (window.navigator.standalone) {
      var portrait = window.innerWidth < window.innerHeight;
      var sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      if (sh > h) h = sh;
    }
    document.documentElement.style.setProperty('--appH', h + 'px');
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
})();
</script>
<style>

    --bg:#f7f2e2; --card:#fffdf7; --ink:#2a2e1f; --muted:#7a7a62; --line:#ece4cc;

    --bink:#4f6b2c; --navbg:rgba(255,253,247,.97); --navon:#fff2cc; --hl:#fff2cc; --pendbg:#f1ecdc; --pendfg:#7a6a3a; --pubg:#fff1c2; --pufg:#7a5200; --shadow:rgba(79,107,44,.08);
  }
  :root[data-theme=dark] {

    --ret:#ff8a4c; --retbg:#3a2416; --warn:#f0b35a; --warnbg:#3a2e14; --link:#c3dc93;
    --bink:#c3dc93; --navbg:rgba(24,28,17,.97); --navon:#2a3a1c; --hl:#2a3320; --pendbg:#2e2c20; --pendfg:#d8cca0; --pubg:#3d3314; --pufg:#ffd77a; --shadow:rgba(0,0,0,.35);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  .kpi b { display:block; font-size:19px; } .kpi span { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:700; }
  .kpi.pos b { color:var(--bink); } .kpi.neg b { color:var(--ret); }
  .list .r.h { font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:800; letter-spacing:.4px; padding:8px 14px; }
  .list .r.g { display:grid; grid-template-columns:minmax(0,1fr) 72px 72px; gap:6px; align-items:center; font-size:14px; }

  .list .r .c { text-align:right; font-variant-numeric:tabular-nums; }
  details.dv > summary { list-style:none; display:flex; justify-content:space-between; align-items:center; padding:13px 14px; border-top:1px solid var(--line); font-weight:800; cursor:pointer; }
  details.dv > summary::-webkit-details-marker { display:none; }
  details.dv .tr { display:flex; justify-content:space-between; gap:8px; padding:8px 14px 8px 24px; font-size:14px; color:var(--muted); border-top:1px dashed var(--line); }

  .chk button.wait { opacity:.4; }
  .chk button.busy { opacity:.6; }
  .note { margin:0 14px 14px; background:var(--warnbg); color:var(--warn); border-radius:12px; padding:10px 12px; font-weight:700; font-size:14px; }

  details.day > summary .today { background:var(--accent); color:#fff; font-size:11px; border-radius:999px; padding:2px 8px; margin-left:8px; vertical-align:middle; }
  details.day[open] > summary { border-bottom:1px solid var(--line); }
  details.day .inner { padding:12px 10px 2px; background:var(--bg); }
  .pay { background:linear-gradient(160deg,var(--brand),var(--brand2)); color:#fff; border-radius:20px; padding:20px; text-align:center; box-shadow:0 4px 16px rgba(79,107,44,.2); }
  .pay .k { font-size:13px; opacity:.8; text-transform:uppercase; letter-spacing:.6px; }
  .pay .amt { font-size:52px; font-weight:900; margin:6px 0; color:var(--cream); }
  .pill { display:inline-block; border-radius:999px; padding:5px 12px; font-weight:800; font-size:13px; }
  .pill.wait { background:#ffd166; color:#5c3d00; } .pill.done { background:#7ee2b8; color:#063d26; }
  .list { background:var(--card); border-radius:16px; box-shadow:0 2px 10px rgba(79,107,44,.07); overflow:hidden; }
  .list .d { background:var(--cream); color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.4px; padding:8px 14px; text-transform:uppercase; }
  .list .r { display:flex; justify-content:space-between; gap:10px; padding:11px 14px; border-top:1px solid var(--line); font-size:15px; }
  .list .r span:last-child { color:var(--muted); white-space:nowrap; }
  nav { flex:none; position:relative; background:var(--navbg); backdrop-filter:blur(8px); border-top:1px solid var(--line); display:flex; padding:6px 8px max(8px, calc(env(safe-area-inset-bottom) - 6px)); z-index:9; }
  nav button { flex:1; border:0; background:none; color:var(--muted); font-size:12px; font-weight:700; padding:6px 4px; border-radius:14px; }
  nav button .i { display:block; font-size:22px; line-height:1.1; filter:grayscale(1); opacity:.6; }
  nav button.on { color:var(--bink); background:var(--navon); }
  nav button.on .i { filter:none; opacity:1; }
  .msg { text-align:center; color:var(--muted); padding:40px 16px; }
  .loader { width:30px; height:30px; border:3px solid #d1d5db; border-top-color:var(--brand); border-radius:50%; margin:0 auto 10px; animation:rot .8s linear infinite; }
  .upd { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
</style>
</head>
<body>
<header>

    <div class="who-wrap">
      <img class="logo" id="logo" src="logo.png" alt="" onerror="this.style.display='none'">

</header>
<div id="scroller"><main id="main"><div class="card msg"><div class="loader"></div><span id="loadmsg"></span></div></main></div>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbxVOk4MGy0CtxX-xWMMhZVI-wOeDVBbD9S8lC-BGsu6oP-BUHPyeQe4vVB2-yrOyYpoHw/exec';
  var T = {
    en: { tabToday:'Today', tabWeek:'This week', tabPay:'Next payment', hi:'Hi, {n}!', loading:'Loading your trips…', trip:'trip', trips:'trips', miles:'miles',
          today:'Today', tomorrow:'Tomorrow', noToday:'No trips today.', noTomorrow:'No trips for tomorrow yet.', weekOf:'Week of ', noWeek:'No trips this week yet.',
          call:'📞 Call', pickup:'Pick up', dropoff:'Drop off', go:'Go ➜', going:'GOING', ret:'RETURN', both:'Round trip', goOnly:'One way', retOnly:'Return only',
          nextPay:'Next payment', paysOn:'🗓 Pays on ', paidOn:'✓ Paid on ', included:'Trips included', noPayWeek:'No trips that week.', updated:'Updated ',
          install:'⬇ Install app', todayTag:'TODAY', noKey:'Open your personal link once to activate the app. Ask Alec for it.',
          offline:'Couldn\'t load your trips. Check your connection and tap ↻.',
          pickedBtn:'Picked up', droppedBtn:'Dropped off', confPU:'Confirm you picked up {n}?', confDO:'Confirm you dropped off {n}?',
          sendFail:'Couldn\'t send. Check your connection and try again.',
          days:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] },
    es: { tabToday:'Hoy', tabWeek:'Esta semana', tabPay:'Próximo pago', hi:'¡Hola, {n}!', loading:'Cargando tus viajes…', trip:'viaje', trips:'viajes', miles:'millas',
          today:'Hoy', tomorrow:'Mañana', noToday:'No tienes viajes hoy.', noTomorrow:'Todavía no hay viajes para mañana.', weekOf:'Semana del ', noWeek:'Todavía no tienes viajes esta semana.',
          call:'📞 Llamar', pickup:'Recoger', dropoff:'Dejar', go:'Ir ➜', going:'IDA', ret:'REGRESO', both:'Ida y regreso', goOnly:'Ida solamente', retOnly:'Solo regreso',
          nextPay:'Próximo pago', paysOn:'🗓 Se paga el ', paidOn:'✓ Pagado el ', included:'Viajes incluidos', noPayWeek:'No tuviste viajes esa semana.', updated:'Actualizado ',
          install:'⬇ Instalar app', todayTag:'HOY', noKey:'Abre tu enlace personal una vez para activar la app. Pídeselo a Alec.',
          offline:'No se pudieron cargar los viajes. Revisa tu conexión y toca ↻.',
          pickedBtn:'Ya lo recogí', droppedBtn:'Ya lo dejé', confPU:'¿Confirmas que recogiste a {n}?', confDO:'¿Confirmas que dejaste a {n}?',
          sendFail:'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.',
          days:['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'] }
  };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var KEY = new URLSearchParams(location.search).get('k') || '';
  if (KEY) store('atc_key', KEY); else KEY = store('atc_key') || '';
  var LANG = store('atc_lang') || '';
  var DATA = null, VIEW = store('atc_view') || 'hoy', RO = false, DRV = store('atc_drv') || '';
  var COLLAPSED = []; try { COLLAPSED = JSON.parse(store('atc_collapsed') || '[]') || []; } catch (e) { COLLAPSED = []; }
  function L() { return T[LANG || (DATA && DATA.lang) || 'en']; }

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; document.getElementById('install').style.display = 'inline-block'; });
  document.getElementById('install').addEventListener('click', function () { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.finally(function () { deferredPrompt = null; document.getElementById('install').style.display = 'none'; }); });

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeUrl(u) { return /^https:\/\//.test(u) ? esc(u) : '#'; }
  function tel(p) { var d = String(p).replace(/\D/g, '').slice(-10); return d.length === 10 ? 'tel:+1' + d : '#'; }
  function mi(n) { return (Math.round(n * 10) / 10).toFixed(1) + ' mi'; }
  function nice(name) { var p = String(name).split(','); return p.length > 1 ? p[1].trim() + ' ' + p[0].trim() : name; }
  function dayName(ymd) { var p = ymd.split('-'); return L().days[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()]; }
  function md(ymd) { var p = ymd.split('-'); return (+p[1]) + '/' + (+p[2]); }
  function niceDay(ymd) { return dayName(ymd) + ' ' + md(ymd); }

  function stop(kind, label, addr, csz, map) {
    return '<div class="stop ' + kind + '"><div class="dot"></div><div><div class="lbl">' + label + '</div><div class="addr">' + esc(addr) + '</div>' +
      (csz ? '<div class="csz">' + esc(csz) + '</div>' : '') + '</div><a class="go" href="' + safeUrl(map) + '" target="_blank" rel="noopener">' + L().go + '</a></div>';
  }
  function leg(t, k) {
    var l = t[k]; if (!l) return '';
    var cls = k === 'ida' ? 'ida' : 'ret', tag = k === 'ida' ? L().going : L().ret;
    return '<div class="leg ' + cls + '"><span class="legtag">' + tag + ' · ' + mi(l.miles) + (l.uber ? ' · 🚕 UBER' : '') + '</span>' +
      (RO ? ' ' + stat(t, k) : '') +
      stop('from', L().pickup, l.from, l.fromCsz, l.fromMap) + stop('to', L().dropoff, l.to, l.toCsz, l.toMap) + checks(t, k) + '</div>';
  }
  function checks(t, k) {
    if (RO || !t.key || !DATA || !DATA.today || t.date !== DATA.today.date) return '';
    var d = t.done || {}, pu = d[k + '_pickup'], dr = d[k + '_dropoff'];
    var b = function (step, label, at, wait) {
      return '<button type="button" class="' + (at ? 'ok' : wait ? 'wait' : '') + '" data-trip="' + esc(t.key) + '" data-leg="' + k + '" data-step="' + step + '" data-name="' + esc(nice(t.name)) + '"' +
        (at || wait ? ' disabled' : '') + '>' + (at ? '✓ ' + label + ' · ' + esc(at) : label) + '</button>';
    };
    return '<div class="chk">' + b('pickup', L().pickedBtn, pu, false) + b('dropoff', L().droppedBtn, dr, !pu) + '</div>';
  }
  function findTrip(key) {
    var all = [];
    if (DATA.today) all = all.concat(DATA.today.trips);
    if (DATA.tomorrow) all = all.concat(DATA.tomorrow.trips);
    if (DATA.week) DATA.week.days.forEach(function (d) { all = all.concat(d.trips); });
    return all.filter(function (t) { return t.key === key; });
  }
  function markStep(btn) {
    var key = btn.getAttribute('data-trip'), k = btn.getAttribute('data-leg'), step = btn.getAttribute('data-step');
    if (!confirm((step === 'pickup' ? L().confPU : L().confDO).replace('{n}', btn.getAttribute('data-name')))) return;
    btn.classList.add('busy'); btn.disabled = true;
    fetch(API + '?api=1&act=mark&k=' + encodeURIComponent(KEY) + '&trip=' + encodeURIComponent(key) + '&leg=' + k + '&step=' + step)
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) throw new Error(res && res.error);
        findTrip(key).forEach(function (t) { t.done = t.done || {}; t.done[k + '_' + step] = res.at; });
        store('atc_data', JSON.stringify(DATA)); render();
      })
      .catch(function () { btn.classList.remove('busy'); btn.disabled = false; alert(L().sendFail); });
  }
  function card(t) {
    var legs = t.ida && t.regreso ? L().both : t.ida ? L().goOnly : L().retOnly;
    var id = cid(t), shut = COLLAPSED.indexOf(id) >= 0;
    var h = '<div class="card' + (shut ? ' shut' : '') + '" data-cid="' + esc(id) + '"><div class="chead" role="button"><div class="time">' + esc(t.time) + '</div><div class="whobox"><div class="who">' + esc(nice(t.name)) + '</div><div class="sub">' + legs + ' · ' + mi(t.miles) + '</div></div><span class="chev">▾</span></div><div class="cbody">';
    var b = '';
    if (t.phone) b += '<a class="btn call" href="' + tel(t.phone) + '">' + L().call + '</a>';
    (t.family || []).forEach(function (f) { b += '<a class="btn" href="' + tel(f.phone) + '">📞 ' + esc(f.label) + '</a>'; });
    if (b) h += '<div class="btns">' + b + '</div>';
    var note = (LANG || DATA.lang) === 'es' ? t.notas : (t.notes || t.notas);
    if (note) h += '<div class="note">⚠️ ' + esc(note) + '</div>';
    return h + leg(t, 'ida') + leg(t, 'regreso') + '</div></div>';
  }
  function cid(t) { return [t.id || t.trip || '', t.date || '', t.time || '', t.name || ''].join('|'); }
  function stats(trips) {
    var m = trips.reduce(function (s, t) { return s + t.miles; }, 0);
    return '<div class="stats"><div class="stat"><b>' + trips.length + '</b><span>' + (trips.length === 1 ? L().trip : L().trips) + '</span></div><div class="stat"><b>' + (Math.round(m * 10) / 10) + '</b><span>' + L().miles + '</span></div></div>';
  }
  function renderHoy() {
    var t = DATA.today.trips, m = DATA.tomorrow.trips;
    var h = stats(t) + '<h2>' + L().today + ' · ' + esc(niceDay(DATA.today.date)) + '</h2>';
    h += t.length ? t.map(card).join('') : '<div class="empty"><div class="big">😎</div>' + L().noToday + '</div>';
    h += '<h2>' + L().tomorrow + ' · ' + esc(niceDay(DATA.tomorrow.date)) + '</h2>';
    h += m.length ? m.map(card).join('') : '<div class="empty">' + L().noTomorrow + '</div>';
    return h;
  }
  function renderSemana() {
    var w = DATA.week, all = [];
    w.days.forEach(function (d) { all = all.concat(d.trips); });
    var h = stats(all) + '<h2>' + L().weekOf + esc(w.label) + '</h2>';
    if (!w.days.length) return h + '<div class="empty"><div class="big">📭</div>' + L().noWeek + '</div>';
    w.days.forEach(function (d) {
      var isToday = d.date === DATA.today.date;
      h += '<details class="day"' + (isToday ? ' open' : '') + '><summary><span>' + esc(niceDay(d.date)) + (isToday ? '<span class="today">' + L().todayTag + '</span>' : '') + '</span><span class="count">' + d.trips.length + ' ' + (d.trips.length === 1 ? L().trip : L().trips) + '</span></summary><div class="inner">' + d.trips.map(card).join('') + '</div></details>';
    });
    return h;
  }
  function $$(n) { var v = Math.round(Number(n || 0) * 100) / 100, neg = v < 0; return (neg ? '-$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function $0(n) { return '$' + Math.round(Number(n || 0)).toLocaleString('en-US'); }
  function stat(t, k) {
    var d = t.done || {}, dn = d[k + '_dropoff'], pu = d[k + '_pickup'];
    if (dn) return '<span class="st dn">✅ Dropped off ' + esc(dn) + '</span>';
    if (pu) return '<span class="st pu">🟢 Picked up ' + esc(pu) + '</span>';
    if (t.date > DATA.today.date) return '<span class="st pend">Scheduled</span>';
    return '<span class="st pend">⏳ Pending</span>';
  }
  function legRow(t, k) {
    var l = t[k]; if (!l) return '';
    var cls = k === 'ida' ? 'ida' : 'ret', tag = k === 'ida' ? 'GOING' : 'RETURN';
    var drv = l.driver ? esc(l.driver) : '<span class="st na">Unassigned</span>';
    return '<div class="lrow ' + cls + '"><span class="legtag">' + tag + '</span><span class="drv">' + drv + '<div class="rt">' + esc(l.from) + ' → ' + esc(l.to) + ' · ' + mi(l.miles) + '</div></span>' + stat(t, k) + '</div>';
  }
  function tripRow(t) {
    var id = 'all|' + t.key + '|' + t.date, shut = COLLAPSED.indexOf(id) >= 0;
    var h = '<div class="card' + (shut ? ' shut' : '') + '" data-cid="' + esc(id) + '"><div class="chead" role="button"><div class="time">' + esc(t.time) + '</div><div class="whobox"><div class="who">' + esc(nice(t.name)) + '</div><div class="sub">' + esc(t.src) + ' · ' + mi(t.miles) + '</div></div><span class="chev">▾</span></div><div class="cbody">';
    if (t.notes) h += '<div class="note" style="margin:0 14px 10px">⚠️ ' + esc(t.notes) + '</div>';
    return h + legRow(t, 'ida') + legRow(t, 'regreso') + '</div></div>';
  }
  function renderTrips() {
    var a = DATA.all, t = a.today, legs = 0, done = 0;
    t.forEach(function (x) { ['ida', 'regreso'].forEach(function (k) { if (x[k]) { legs++; if ((x.done || {})[k + '_dropoff']) done++; } }); });
    var miles = t.reduce(function (s, x) { return s + x.miles; }, 0);
    var h = '<div class="kpis"><div class="kpi"><b>' + t.length + '</b><span>Trips</span></div><div class="kpi"><b>' + done + '/' + legs + '</b><span>Legs done</span></div><div class="kpi"><b>' + (Math.round(miles * 10) / 10) + '</b><span>Miles</span></div></div>';
    h += '<h2>Today · ' + esc(niceDay(DATA.today.date)) + '</h2>';
    h += t.length ? t.map(tripRow).join('') : '<div class="empty">No trips today.</div>';
    h += '<details class="day"><summary><span>Tomorrow · ' + esc(niceDay(a.tomorrowDate)) + '</span><span class="count">' + a.tomorrow.length + ' trips</span></summary><div class="inner">' +
      (a.tomorrow.length ? a.tomorrow.map(tripRow).join('') : '<div class="empty">No trips yet.</div>') + '</div></details>';
    return h;
  }
  function kpis(o) {
    return '<div class="kpis"><div class="kpi"><b>' + $0(o.revenue) + '</b><span>Revenue</span></div><div class="kpi neg"><b>' + $0(o.pay) + '</b><span>Driver pay</span></div><div class="kpi pos"><b>' + $0(o.profit) + '</b><span>Profit</span></div></div>';
  }
  function periodHtml(p, open) {
    var t = p.total, src = Object.keys(t.bySrc).map(function (s) { return esc(s) + ' ' + $$(t.bySrc[s]); }).join(' · ');
    var h = '<div class="pay" style="text-align:left"><div class="k">Pay period ' + esc(md(p.start)) + ' – ' + esc(md(p.end)) + ' (Wed–Tue)</div><div class="amt" style="font-size:40px">' + $$(t.revenue) + '</div>' +
      '<div class="k" style="opacity:.9">' + t.trips + ' trips' + (src ? ' · ' + src : '') + '</div></div>';
    h += '<div style="margin-top:10px">' + kpis(t) + '</div>';
    h += '<div class="list" style="margin-top:10px"><div class="r h g"><span>Day</span><span class="c">Revenue</span><span class="c">Profit</span></div>';
    p.days.forEach(function (d) {
      var isSun = new Date(d.date + 'T12:00:00').getDay() === 0;
      if (isSun && !d.trips) return;
      var isT = d.date === DATA.today.date;
      h += '<div class="r g"' + (isT ? ' style="background:var(--hl)"' : '') + '><span>' + esc(niceDay(d.date)) + ' <span style="color:var(--muted);font-size:12px">· ' + d.trips + '</span></span><span class="c">' + $0(d.revenue) + '</span><span class="c" style="color:var(--bink);font-weight:800">' + $0(d.profit) + '</span></div>';
    });
    return h + '</div>';
  }
  function renderMoney() {
    var m = DATA.money;
    var h = '<h2>Today · ' + esc(niceDay(DATA.today.date)) + ' · ' + m.today.trips + ' trips</h2>' + kpis(m.today);
    h += '<h2>This pay period</h2>' + periodHtml(m.current);
    h += '<details class="day" style="margin-top:16px"><summary><span>Last pay period · ' + esc(md(m.previous.start)) + ' – ' + esc(md(m.previous.end)) + '</span><span class="count">' + $0(m.previous.total.revenue) + '</span></summary><div class="inner">' + periodHtml(m.previous) + '</div></details>';
    h += '<div class="upd">Revenue = trip totals · Profit = Keep column. Trips without pay entered count as full profit.</div>';
    return h;
  }
  function renderPayouts() {
    var ps = DATA.payouts || [];
    if (!ps.length) return '<div class="empty">No upcoming payouts found.</div>';
    var h = '';
    ps.forEach(function (p, i) {
      var paid = p.sendOn < DATA.today.date;
      h += '<h2>' + (paid ? 'Paid' : 'Upcoming payout') + ' · ' + esc(niceDay(p.sendOn)) + '</h2>';
      h += '<div class="pay"><div class="k">Trips ' + esc(md(p.start)) + ' – ' + esc(md(p.end)) + '</div><div class="amt">' + $0(p.total) + '</div>' +
        '<span class="pill ' + (paid ? 'done' : 'wait') + '">' + (paid ? '✓ Paid ' : '🗓 Pay on ') + esc(dayName(p.sendOn)) + ' ' + esc(md(p.sendOn)) + '</span>' +
        '<div class="k" style="margin-top:10px">' + p.drivers.length + ' drivers</div></div>';
      h += '<div class="list" style="margin-top:10px">';
      p.drivers.forEach(function (d) {
        var src = Object.keys(d.bySrc).length > 1 ? Object.keys(d.bySrc).map(function (s) { return esc(s) + ' ' + $0(d.bySrc[s]); }).join(' · ') : '';
        h += '<details class="dv"><summary><span>' + esc(d.name) + ' <span style="color:var(--muted);font-size:12px;font-weight:700">· ' + d.trips.length + ' trips</span></span><span>' + (d.amount ? $0(d.amount) : '<span class="st pend">Pay not entered</span>') + '</span></summary>' +
          (src ? '<div class="tr"><span>' + src + '</span></div>' : '') +
          d.trips.map(function (t) {
            var legs = t.legs.length === 2 ? 'Round trip' : t.legs[0] === 'ida' ? 'Going' : 'Return';
            return '<div class="tr"><span>' + esc(md(t.date)) + ' ' + esc(t.time) + ' · ' + esc(nice(t.name)) + '</span><span>' + legs + '</span></div>';
          }).join('') + '</details>';
      });
      h += '</div>';
    });
    return h;
  }
  function renderDrivers() {
    var ss = DATA.schedules || [];
    if (!ss.length) return '<div class="empty">No drivers found.</div>';
    var cur = ss.filter(function (s) { return s.name === DRV; })[0] || ss[0];
    var h = '<div class="chips">' + ss.map(function (s) { return '<button type="button" class="chip' + (s === cur ? ' on' : '') + '" data-drv="' + esc(s.name) + '">' + esc(s.name) + '</button>'; }).join('') + '</div>';
    var td = DATA.today.date;
    var today = cur.trips.filter(function (t) { return t.date === td; });
    RO = true;
    h += stats(today) + '<h2>This week</h2>';
    var days = {}, order = [];
    cur.trips.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
      .forEach(function (t) { if (!days[t.date]) { days[t.date] = []; order.push(t.date); } days[t.date].push(t); });
    if (order.indexOf(td) < 0) { order.push(td); order.sort(); days[td] = []; }
    h += order.map(function (d) {
      var n = days[d].length, lbl = (d === td ? 'Today · ' : '') + niceDay(d);
      return '<details class="day"' + (d === td ? ' open' : '') + '><summary><span>' + esc(lbl) + '</span><span class="count">' +
        (d < td ? 'done · ' : '') + n + (n === 1 ? ' trip' : ' trips') + '</span></summary><div class="inner">' +
        (n ? days[d].map(card).join('') : '<div class="empty">' + esc(cur.name) + ' has no trips today.</div>') + '</div></details>';
    }).join('');
    RO = false;
    return h;
  }
  function renderPago() {
    var p = DATA.pay;
    var h = '<div class="pay"><div class="k">' + L().nextPay + '</div><div class="amt">$' + Number(p.amount).toLocaleString('en-US') + '</div>' +
      '<span class="pill ' + (p.paid ? 'done' : 'wait') + '">' + (p.paid ? L().paidOn : L().paysOn) + esc(p.sendOn) + '</span>' +
      '<div class="k" style="margin-top:12px">' + L().weekOf + esc(p.label) + '</div></div>';
    if (!p.days.length) return h + '<div class="empty" style="margin-top:14px">' + L().noPayWeek + '</div>';
    h += '<h2>' + L().included + ' · ' + mi(p.miles) + '</h2><div class="list">';
    p.days.forEach(function (d) {
      h += '<div class="d">' + esc(niceDay(d.date)) + '</div>';
      d.trips.forEach(function (t) { h += '<div class="r"><span>' + esc(t.time) + ' · ' + esc(nice(t.name)) + '</span><span>' + mi(t.miles) + '</span></div>'; });
    });
    return h + '</div>';
  }
  function chrome() {
    var cur = LANG || (DATA && DATA.lang) || 'en';
    document.documentElement.lang = cur;
    document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = L()[e.dataset.t]; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('on', b.dataset.l === cur); });
    var adm = !!(DATA && DATA.admin);
    document.querySelectorAll('nav button').forEach(function (b) {
      var isAdm = b.classList.contains('adm'), hideForAdm = b.dataset.v === 'semana' || b.dataset.v === 'pago';
      b.style.display = adm ? (hideForAdm ? 'none' : 'block') : (isAdm ? 'none' : 'block');
      var v = VIEW; if (!adm && /^(trips|money|payouts|drivers)$/.test(v)) v = 'hoy'; if (adm && /^(semana|pago)$/.test(v)) v = 'hoy';
      b.classList.toggle('on', b.dataset.v === v);
    });
    document.getElementById('install').textContent = L().install;
    var lm = document.getElementById('loadmsg'); if (lm) lm.textContent = L().loading;
    if (DATA && !DATA.error) {
      document.getElementById('hola').textContent = L().hi.replace('{n}', DATA.admin ? 'Alec' : DATA.driver);
      document.getElementById('fecha').textContent = dayName(DATA.today.date) + ', ' + md(DATA.today.date);
    }
  }
  function render() {
    chrome();
    if (!DATA) return;
    if (DATA.nokey) {
      document.getElementById('main').innerHTML = '<div class="card msg">' + esc(L().noKey) +
        '<div style="margin-top:14px;display:flex;gap:8px"><input id="keyin" placeholder="' + (LANG === 'es' ? 'Pega tu enlace aquí' : 'Paste your link here') +
        '" style="flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid #d8cfb2;font:inherit;background:#fff">' +
        '<button id="keygo" style="padding:12px 16px;border:0;border-radius:12px;background:#4f6b2c;color:#fff;font:inherit;font-weight:700">OK</button></div></div>';
      document.getElementById('keygo').onclick = function () {
        var v = document.getElementById('keyin').value.trim(), m = v.match(/[?&]k=([A-Za-z0-9]+)/);
        KEY = m ? m[1] : (/^[A-Za-z0-9]{16,}$/.test(v) ? v : '');
        if (KEY) { store('atc_key', KEY); DATA = null; load(); }
      };
      return;
    }
    if (DATA.error) { document.getElementById('main').innerHTML = '<div class="card msg">' + esc(DATA.error) + '</div>'; return; }
    var adminViews = { trips: renderTrips, money: renderMoney, payouts: renderPayouts, drivers: renderDrivers };
    var V = VIEW;
    if (adminViews[V] && !DATA.admin) V = 'hoy';
    if (DATA.admin && (V === 'semana' || V === 'pago')) V = 'hoy';
    if (DATA.admin && DATA.adminError && VIEW !== 'hoy') { document.getElementById('main').innerHTML = '<div class="card msg">Couldn\'t load this tab: ' + esc(DATA.adminError) + '</div>'; return; }
    chrome();
    var html = adminViews[V] && DATA.admin ? adminViews[V]() : V === 'semana' ? renderSemana() : V === 'pago' ? renderPago() : renderHoy();
    document.getElementById('main').innerHTML = html + '<div class="upd">' + L().updated + esc(DATA.now) + '</div>';
  }
  function load() {
    var r = document.getElementById('refresh'); r.classList.add('spin');
    if (!KEY) { r.classList.remove('spin'); DATA = { error: 'nokey', nokey: true }; render(); return; }
    fetch(API + '?api=1&k=' + encodeURIComponent(KEY)).then(function (res) { return res.json(); }).then(function (d) {
      r.classList.remove('spin');
      if (!d.error) store('atc_data', JSON.stringify(d));
      DATA = d; render();
    }).catch(function () {
      r.classList.remove('spin');
      if (!DATA) document.getElementById('main').innerHTML = '<div class="card msg">' + L().offline + '</div>';
    });
  }
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { VIEW = b.dataset.v; store('atc_view', VIEW); render(); document.getElementById('scroller').scrollTop = 0; });
  });
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { LANG = b.dataset.l; store('atc_lang', LANG); render(); });
  });
  document.getElementById('refresh').addEventListener('click', load);
  function applyTheme() {
    var t = store('atc_theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('theme').textContent = t === 'dark' ? '☀️' : '🌙';
    var mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.setAttribute('content', t === 'dark' ? '#3f5a22' : '#4f6b2c');
  }
  document.getElementById('theme').addEventListener('click', function () {
    store('atc_theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); applyTheme();
  });
  applyTheme();
  document.getElementById('main').addEventListener('click', function (e) {
    var chip = e.target.closest && e.target.closest('.chip');
    if (chip) { DRV = chip.getAttribute('data-drv'); store('atc_drv', DRV); render(); return; }
    var mk = e.target.closest && e.target.closest('.chk button');
    if (mk) { if (!mk.disabled) markStep(mk); return; }
    var hd = e.target.closest && e.target.closest('.chead'); if (!hd) return;
    var c = hd.parentNode, id = c.getAttribute('data-cid'), i = COLLAPSED.indexOf(id);
    c.classList.toggle('shut');
    if (c.classList.contains('shut')) { if (i < 0) COLLAPSED.push(id); } else if (i >= 0) COLLAPSED.splice(i, 1);
    if (COLLAPSED.length > 200) COLLAPSED = COLLAPSED.slice(-200);
    store('atc_collapsed', JSON.stringify(COLLAPSED));
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  setInterval(load, 5 * 60 * 1000);
  try { var cached = store('atc_data'); if (cached && KEY) DATA = JSON.parse(cached); } catch (e) {}
  render(); load();
</script>
